name: audit

# uv.lock against OSV (#397), ported from CannObserv/broker#86 and
# CannObserv/archiver#420. Dependabot's uv ecosystem can't sync the private
# wheelhouse co-core resolves from (#283), so nothing else audits the lock
# between patching-hosts runs (#382, class 6).
#
# Report-only: scripts/audit_lock.sh always exits 0, and a finding is a warning
# annotation plus the job summary, runtime and dev under separate titles. A red
# gate here would turn main red on someone else's disclosure date. Its own
# workflow, not a ci.yml job: the epic gate reads ci.yml's jobs alone.
#
# The weekly run reads the lock nobody touched, since disclosures arrive without
# commits. Push and PR runs read a lock a change ships: watcher lands by a local
# merge and a push, so push carries the same filter PRs do.
#
# No secret and no OIDC token: `uv audit --frozen` reads uv.lock without the
# wheelhouse, so it needs no WIF. tests/ci/test_audit_workflow.py pins this.

on:
  push:
    branches: [main]
    paths: [uv.lock, pyproject.toml, scripts/audit_lock.sh, .github/workflows/audit.yml]
  pull_request:
    branches: [main]
    paths: [uv.lock, pyproject.toml, scripts/audit_lock.sh, .github/workflows/audit.yml]
  schedule:
    - cron: '41 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: uv audit (report-only)
    # ci.yml's runner: the job needs only the uv binary, but one image per repo
    # keeps the host check whole (#365, tests/ci/test_workflow_pins.py).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # --frozen downloads no package, so there is nothing to cache, and so
          # nothing to prune (tests/ci/test_dependabot.py).
          enable-cache: false

      - name: uv audit --frozen
        run: bash scripts/audit_lock.sh
