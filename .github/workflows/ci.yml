name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same PR; never cancel runs on main (keep
# CI signal for every commit that lands on the protected branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    # WIF: mint an OIDC token for google-github-actions/auth to impersonate the
    # read-only co-pypi-reader SA and pull the cannobserv wheelhouse (#220).
    # Job-scoped so no other job gains cloud access it doesn't need.
    permissions:
      contents: read
      id-token: write
    steps:
      # No sibling checkout, in this job or any other: #254 removed the
      # `archiver-client` path dep, and #311 the `test` job's subprocess run of
      # archiver's alembic.
      - uses: actions/checkout@v5
        with:
          path: watcher

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      # co-core / co-core-aio resolve from a wheelhouse mirrored from the private
      # GCS index (#220). Authenticate keyless via Workload Identity Federation —
      # the read-scoped `github-ci` provider impersonating the objectViewer-only
      # co-pypi-reader SA — then sync before `uv sync`.
      - name: Authenticate to Google Cloud (WIF, read-only)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: co-pypi-reader@co-gcs.iam.gserviceaccount.com

      - name: Sync cannobserv wheelhouse
        working-directory: watcher
        run: uv run --no-project --with 'google-cloud-storage>=2,<4' python scripts/sync_wheelhouse.py

      - name: uv sync
        working-directory: watcher
        run: uv sync --group dev

      - name: ruff check
        working-directory: watcher
        run: uv run ruff check .

      - name: ruff format --check
        working-directory: watcher
        run: uv run ruff format --check .

  # output.css gate (#352): nothing else runs scripts/check-css.sh once a clone
  # skips `pre-commit install`. Node and the pinned CLI only — no OIDC token,
  # no wheelhouse, no uv. Keep the pin equal to scripts/build-css.sh's.
  css:
    name: css
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tailwind CLI (pinned)
        run: npm install -g @tailwindcss/cli@4.2.4

      - name: check-css
        run: bash scripts/check-css.sh

  test:
    name: test
    runs-on: ubuntu-latest
    # WIF: mint an OIDC token for google-github-actions/auth (see the lint job).
    permissions:
      contents: read
      id-token: write
    # No database, deliberately (#353 CR 2). conftest needs the variable set and
    # _test-suffixed, never a server; port 1 points at nothing, so an unmarked
    # test that connects fails HERE — the job that names the wrong half —
    # instead of passing in the default suite. DB-backed tests are `integration`.
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://nobody:nothing@127.0.0.1:1/watcher_test

    steps:
      - uses: actions/checkout@v5
        with:
          path: watcher

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Authenticate to Google Cloud (WIF, read-only)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: co-pypi-reader@co-gcs.iam.gserviceaccount.com

      - name: Sync cannobserv wheelhouse (watcher)
        working-directory: watcher
        run: uv run --no-project --with 'google-cloud-storage>=2,<4' python scripts/sync_wheelhouse.py

      - name: uv sync
        working-directory: watcher
        run: uv sync --group dev

      # This job builds no schema — it has no database (see above). The
      # `integration` job below builds it with Base.metadata.create_all
      # (conftest); the migration chain is smoke-checked in the `migrations`
      # job (#234). `live` tests (real GCS) run in no job (#353).
      - name: pytest (default, excludes integration and live)
        working-directory: watcher
        run: uv run pytest -m "not integration and not live"

  # The integration mark (#353): tests that need the test database and nothing
  # external — checked by running them with only TEST_DATABASE_URL set and no
  # outbound network. Its own job so a red X says which half broke. Setup is
  # the `test` job's, step for step (tests/test_integration_gate.py pins it).
  # Schema comes from Base.metadata.create_all (conftest), not migrations —
  # the `migrations` job below covers the chain (#234).
  integration:
    name: integration
    runs-on: ubuntu-latest
    # WIF: mint an OIDC token for google-github-actions/auth (see the lint job).
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watcher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/watcher_test

    steps:
      - uses: actions/checkout@v5
        with:
          path: watcher

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Authenticate to Google Cloud (WIF, read-only)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: co-pypi-reader@co-gcs.iam.gserviceaccount.com

      - name: Sync cannobserv wheelhouse (watcher)
        working-directory: watcher
        run: uv run --no-project --with 'google-cloud-storage>=2,<4' python scripts/sync_wheelhouse.py

      - name: uv sync
        working-directory: watcher
        run: uv sync --group dev

      - name: pytest (integration)
        working-directory: watcher
        run: uv run pytest -m integration --junitxml=integration-junit.xml

      # A self-skipping test (the backup rehearsal without pg_dump, say) passes
      # green while verifying nothing; this makes "runs in CI" true or red.
      - name: no integration test skipped
        working-directory: watcher
        run: uv run python scripts/check_no_skips.py integration-junit.xml

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    # WIF: mint an OIDC token for google-github-actions/auth (see the lint job).
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watcher_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # watcher's alembic env.py reads WATCHER_MIGRATION_DATABASE_URL, else
      # DATABASE_URL (#259) — never TEST_DATABASE_URL. Only the fallback is set
      # here, so this job also covers the single-role shape every host has
      # until scripts/setup-db-roles.sql runs.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/watcher_migration

    steps:
      - uses: actions/checkout@v5
        with:
          path: watcher
      # No sibling checkout (#254 removed the `archiver-client` path dep that was
      # its only reason here). This job runs no archiver alembic and seeds no
      # `information` schema: the #234 squash collapsed the pre-existing
      # chain into a self-contained genesis baseline that references no
      # archiver-owned schema, so `upgrade head` from an empty database is fully
      # standalone.

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Authenticate to Google Cloud (WIF, read-only)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: co-pypi-reader@co-gcs.iam.gserviceaccount.com

      - name: Sync cannobserv wheelhouse (watcher)
        working-directory: watcher
        run: uv run --no-project --with 'google-cloud-storage>=2,<4' python scripts/sync_wheelhouse.py

      - name: uv sync
        working-directory: watcher
        run: uv sync --group dev

      # Independent migration-chain smoke-check (#234): apply the full chain
      # end-to-end against an empty Postgres. Catches a broken migration that
      # pytest (create_all-based) would miss — the deploy bootstrap path.
      - name: alembic upgrade head (from empty DB)
        working-directory: watcher
        run: uv run alembic upgrade head

      # Fail on model <-> migration drift (autogenerate would emit operations).
      - name: alembic check
        working-directory: watcher
        run: uv run alembic check
