name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same PR; never cancel runs on main (keep
# CI signal for every commit that lands on the protected branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs ubuntu-24.04, the host's release, never ubuntu-latest (#365):
# 26.04's PostgreSQL 18 client broke the backup rehearsal against postgres:16.
# On the host, tests/ci/test_workflow_pins.py fails until this follows it.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # #416, every job: the slowest measured (integration) took 54 s
    # WIF: mint an OIDC token for google-github-actions/auth to impersonate the
    # read-only co-pypi-reader SA, whose access token reads the co-pypi index
    # co-core resolves from (#358). Job-scoped so no other job gains cloud
    # access it doesn't need.
    permissions:
      contents: read
      id-token: write
    steps:
      # No sibling checkout, in this job or any other: #254 removed the
      # `archiver-client` path dep, and #311 the `test` job's subprocess run of
      # archiver's alembic.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: watcher

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true

      - name: Install Python
        run: uv python install 3.12

      # co-core / co-core-aio resolve from the co-pypi Artifact Registry index
      # (#358). Authenticate keyless via Workload Identity Federation — the
      # read-scoped `github-ci` provider impersonating the co-pypi-reader SA
      # (artifactregistry.reader) — and mint its access token for `uv sync`.
      - name: Authenticate to Google Cloud (WIF, read-only)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: co-pypi-reader@co-gcs.iam.gserviceaccount.com
          token_format: access_token

      - name: uv sync
        working-directory: watcher
        # The co-pypi pair, on this step alone (#358): later `uv run`s find the
        # venv synced and download nothing. A masked output; never echo it.
        env:
          UV_INDEX_CO_PYPI_USERNAME: oauth2accesstoken
          UV_INDEX_CO_PYPI_PASSWORD: ${{ steps.auth.outputs.access_token }}
        run: uv sync --group dev

      - name: ruff check
        working-directory: watcher
        run: uv run ruff check .

      - name: ruff format --check
        working-directory: watcher
        run: uv run ruff format --check .

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # WIF: mint an OIDC token for google-github-actions/auth (see the lint job).
    permissions:
      contents: read
      id-token: write
      statuses: read # the attest step reads gate/local (#456)
    # No database, deliberately (#353 CR 2). conftest needs the variable set and
    # _test-suffixed, never a server; port 1 points at nothing, so an unmarked
    # test that connects fails HERE — the job that names the wrong half —
    # instead of passing in the default suite. DB-backed tests are `integration`.
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://nobody:nothing@127.0.0.1:1/watcher_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: watcher

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Authenticate to Google Cloud (WIF, read-only)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: co-pypi-reader@co-gcs.iam.gserviceaccount.com
          token_format: access_token

      - name: uv sync
        working-directory: watcher
        # The co-pypi pair, on this step alone (#358): later `uv run`s find the
        # venv synced and download nothing. A masked output; never echo it.
        env:
          UV_INDEX_CO_PYPI_USERNAME: oauth2accesstoken
          UV_INDEX_CO_PYPI_PASSWORD: ${{ steps.auth.outputs.access_token }}
        run: uv sync --group dev

      # Local-gate attestation (#456): shipping-work's push.sh, with
      # .skills/attest-local-gate on, posts gate/local = success on a commit
      # whose exact tree passed scripts/pre-ship.sh, which runs this job's
      # suite with this job's TEST_DATABASE_URL (#406) and then the
      # integration mark. Copied from the vendor's
      # shipping-work/references/attestation.md, its explanation moved out of
      # `run:` (tests split every step's run with shlex):
      # - HEAD is the PR's head: on pull_request, github.sha is the merge
      #   commit, which nobody gated.
      # - The combined status keeps each context's latest state (/statuses
      #   lists every one ever posted), a page of 100 contexts.
      # - A refused read fails the step under bash -e: loud, never a silent
      #   skip. tests/ci/test_attest_local_gate.py pins it.
      - name: attest (gate/local)
        id: attest
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/commits/$HEAD/status?per_page=100" \
                --jq '[.statuses[] | select(.context == "gate/local" and .state == "success")] | length')
          echo "attested=$([ "$n" -gt 0 ] && echo yes || echo no)" >>"$GITHUB_OUTPUT"

      # This job builds no schema — it has no database (see above). The
      # `integration` job below builds it with Base.metadata.create_all
      # (conftest); the migration chain is smoke-checked in the `migrations`
      # job (#234). `live` tests (real GCS) run in no job (#353).
      # Skipped only for an attested human same-repo PR, never for a bot's PR
      # or a fork's (attestation.md's `if:`, verbatim; its branch-push arm is
      # inert here, where only main's push triggers). The squash commit on
      # main is GitHub's and carries no status, so main's push runs always run
      # it.
      - name: pytest (default, excludes integration and live)
        working-directory: watcher
        if: >-
          steps.attest.outputs.attested != 'yes'
          || (github.event_name != 'push' && github.event_name != 'pull_request')
          || startsWith(github.ref, 'refs/tags/')
          || (github.event_name == 'pull_request'
              && (github.event.pull_request.user.type == 'Bot'
                  || github.event.pull_request.head.repo.full_name != github.repository))
        run: uv run pytest -m "not integration and not live"

  # The integration mark (#353): tests that need the test database and nothing
  # external — checked by running them with only TEST_DATABASE_URL set and no
  # outbound network. Its own job so a red X says which half broke. Setup is
  # the `test` job's, step for step (tests/test_integration_gate.py pins it).
  # Schema comes from Base.metadata.create_all (conftest), not migrations —
  # the `migrations` job below covers the chain (#234).
  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # WIF: mint an OIDC token for google-github-actions/auth (see the lint job).
    permissions:
      contents: read
      id-token: write
      statuses: read # the attest step reads gate/local (#456)
    services:
      postgres:
        # Docker Hub's official image via Google's mirror: GitHub's shared runners
        # exhaust Docker Hub's anonymous pull limit (tests/ci/test_service_images.py).
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watcher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/watcher_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: watcher

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Authenticate to Google Cloud (WIF, read-only)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: co-pypi-reader@co-gcs.iam.gserviceaccount.com
          token_format: access_token

      - name: uv sync
        working-directory: watcher
        # The co-pypi pair, on this step alone (#358): later `uv run`s find the
        # venv synced and download nothing. A masked output; never echo it.
        env:
          UV_INDEX_CO_PYPI_USERNAME: oauth2accesstoken
          UV_INDEX_CO_PYPI_PASSWORD: ${{ steps.auth.outputs.access_token }}
        run: uv sync --group dev

      # The test job's attest step, identical (#456; see there).
      - name: attest (gate/local)
        id: attest
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/commits/$HEAD/status?per_page=100" \
                --jq '[.statuses[] | select(.context == "gate/local" and .state == "success")] | length')
          echo "attested=$([ "$n" -gt 0 ] && echo yes || echo no)" >>"$GITHUB_OUTPUT"

      # The test job's pytest `if:`, identical (#456; see there).
      - name: pytest (integration)
        working-directory: watcher
        if: >-
          steps.attest.outputs.attested != 'yes'
          || (github.event_name != 'push' && github.event_name != 'pull_request')
          || startsWith(github.ref, 'refs/tags/')
          || (github.event_name == 'pull_request'
              && (github.event.pull_request.user.type == 'Bot'
                  || github.event.pull_request.head.repo.full_name != github.repository))
        run: uv run pytest -m integration --junitxml=integration-junit.xml

      # A self-skipping test (the backup rehearsal without pg_dump, say) passes
      # green while verifying nothing; this makes "runs in CI" true or red.
      # The pytest step's `if:`: it reads the JUnit file that step writes, so
      # it is skipped with it (#456).
      - name: no integration test skipped
        working-directory: watcher
        if: >-
          steps.attest.outputs.attested != 'yes'
          || (github.event_name != 'push' && github.event_name != 'pull_request')
          || startsWith(github.ref, 'refs/tags/')
          || (github.event_name == 'pull_request'
              && (github.event.pull_request.user.type == 'Bot'
                  || github.event.pull_request.head.repo.full_name != github.repository))
        run: uv run python scripts/check_no_skips.py integration-junit.xml

  migrations:
    name: migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # WIF: mint an OIDC token for google-github-actions/auth (see the lint job).
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        # Docker Hub's official image via Google's mirror: GitHub's shared runners
        # exhaust Docker Hub's anonymous pull limit (tests/ci/test_service_images.py).
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watcher_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # watcher's alembic env.py reads WATCHER_MIGRATION_DATABASE_URL, else
      # DATABASE_URL (#259) — never TEST_DATABASE_URL. Only the fallback is set
      # here, so this job also covers the single-role shape every host has
      # until scripts/setup-db-roles.sql runs.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/watcher_migration

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: watcher
      # No sibling checkout (#254 removed the `archiver-client` path dep that was
      # its only reason here). This job runs no archiver alembic and seeds no
      # `information` schema: the #234 squash collapsed the pre-existing
      # chain into a self-contained genesis baseline that references no
      # archiver-owned schema, so `upgrade head` from an empty database is fully
      # standalone.

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Authenticate to Google Cloud (WIF, read-only)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: co-pypi-reader@co-gcs.iam.gserviceaccount.com
          token_format: access_token

      - name: uv sync
        working-directory: watcher
        # The co-pypi pair, on this step alone (#358): later `uv run`s find the
        # venv synced and download nothing. A masked output; never echo it.
        env:
          UV_INDEX_CO_PYPI_USERNAME: oauth2accesstoken
          UV_INDEX_CO_PYPI_PASSWORD: ${{ steps.auth.outputs.access_token }}
        run: uv sync --group dev

      # Independent migration-chain smoke-check (#234): apply the full chain
      # end-to-end against an empty Postgres. Catches a broken migration that
      # pytest (create_all-based) would miss — the deploy bootstrap path.
      - name: alembic upgrade head (from empty DB)
        working-directory: watcher
        run: uv run alembic upgrade head

      # Fail on model <-> migration drift (autogenerate would emit operations).
      - name: alembic check
        working-directory: watcher
        run: uv run alembic check
