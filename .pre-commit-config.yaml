repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff lint
        entry: uv run ruff check .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format-check
        name: ruff format check
        entry: uv run ruff format --check .
        language: system
        types_or: [python, markdown]
        pass_filenames: false

      - id: tailwind-css
        name: tailwind CSS up to date
        entry: bash scripts/check-css.sh
        language: system
        # Every Tailwind @source (templates, authored JS, dashboard Python),
        # the CSS itself and its build scripts (#352).
        files: '^(src/dashboard/.*\.(html|js|py|css)|scripts/(build|check)-css\.sh|scripts/wrap-vendor-css\.py)$'
        pass_filenames: false
