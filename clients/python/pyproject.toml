[project]
name = "information-client"
version = "0.1.0"
description = "Async Python SDK for the Information service. Generated from the service's OpenAPI schema; pinned 1:1 with server version."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0,<1",
    "python-ulid>=3.0.0,<4",
    "attrs>=24",                   # required by openapi-python-client output
    "python-dateutil>=2.9",        # required by openapi-python-client output
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=1.3.0,<2",
    "respx>=0.22",
    "openapi-python-client>=0.21,<1",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["src/information_client"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
