# watcher's config for the cohort disk GC on co-watcher (#385). Tracked here,
# installed to /etc/cannobserv/disk-gc/disk-gc.conf (root, 0644):
#   sudo install -D -m 0644 -o root -g root deploy/disk-gc.conf \
#     /etc/cannobserv/disk-gc/disk-gc.conf
# tests/deploy/test_disk_gc.py holds the decisions below and the installed
# copy to this one. Edited from the VERSION 4 layer's disk-gc.conf.example;
# its comments follow, unchanged.
#
# The disk GC and headroom sensor's config for this host (provisioner#61).
# Install it as /etc/cannobserv/disk-gc/disk-gc.conf (root, 0644), edit it,
# then enable the timers. An unknown section, key or tier, or a malformed
# value, fails the run: nothing is guessed.

[gc]
# The homes whose tooling trees it may prune, space-separated. Each home's
# owner is who must own every tree it removes there, and its user name finds
# /tmp/pytest-of-<user>.
homes = /home/exedev

# A tree with any entry modified or changed in this many minutes is withheld:
# an install in progress is named by no process yet.
grace_minutes = 60

# The tiers on this host, space-separated, from:
#   vscode-servers     ~/.vscode-server/cli/servers/Stable-*, unless in use,
#                      the newest of those newer than the newest live one,
#                      or the newest when none is live (by
#                      server/product.json's version; one whose version
#                      can't be read stays)
#   vscode-clis        ~/.vscode-server/code-*, unless in use
#   claude-extensions  Claude Code versions extensions.json doesn't register
#   vsix-cache         ~/.vscode-server/data/CachedExtensionVSIXs/*
#   plugin-cache       ~/.claude/plugins/cache versions no longer installed
#   npx                ~/.npm/_npx trees, except each pinned SOCRATICODE_SPEC's
#   npm-cache          ~/.npm/_cacache
#   pytest-garbage     /tmp/pytest-of-<user>/garbage-*
#   worktrees          unregistered dirs under worktree_repos' worktree roots
#   uv                 uv cache prune --force, and clean over uv_clean_above_mb
#   docker             dangling images and old build cache; never a container
#                      or a volume. Off here: turn it on where Docker builds.
tiers = vscode-servers vscode-clis claude-extensions vsix-cache plugin-cache npx npm-cache pytest-garbage uv

# Repo settings files that pin SOCRATICODE_SPEC (env.SOCRATICODE_SPEC), e.g.
# /home/exedev/<repo>/.claude/settings.json. VS Code's machine setting is read
# too. One that can't be read keeps every npx tree.
npx_spec_files = /home/exedev/watcher/.claude/settings.json

# Repos whose .worktrees/ and .claude/worktrees/ hold worktrees: a directory
# there that git doesn't register, untouched for grace_minutes (never less
# than 30; 60 by default), is removed.
worktree_repos =

# uv cache clean --force when the cache is over this many MB; 0 never cleans.
# A venv built with --link-mode symlink breaks when its cache is cleaned:
# leave 0 on a host that has one.
uv_clean_above_mb = 0

# docker: build cache unused for this many hours goes (0: all of it). Dangling
# images go once created more than grace_minutes ago.
docker_cache_hours = 168

# docker: buildx builders whose cache goes too, as <user>:<builder>: buildx
# keeps a builder in the ~/.docker of the user who made it.
docker_builders =

# docker: tagged images no container uses, created more than this many days
# ago; 0 never.
# A pulled-but-unused image goes, and a pull brings back whatever it was
# rebuilt to drop (usa-wa's slimmed ollama). Opt in per host.
docker_unused_images_days = 0

[sensor]
# The filesystem it watches, and the Use% it alerts at, as df reports it.
mount = /
alert_at_percent = 85

# Once alerting, it clears only at or below this Use%. In between, it keeps
# alerting, and a first reading there is ok (provisioner#85). A test run holds
# ~0.5G in /tmp until the next one, so one line pages and clears per commit
# once the baseline sits near it. Below alert_at_percent; left out, it's
# alert_at_percent - 5. Lower or drop it with alert_at_percent for a test:
# a change to either line judges the next reading afresh.
clear_at_percent = 80

# Alert gc-stale when the GC hasn't finished a run in this many hours; 0 off.
gc_stale_hours = 72

# This host's co-status monitor, co-watcher-disk-headroom (CannObserv/status#112).
# Its key goes in /etc/cannobserv/disk-gc/checkin.key (root, 0600), never here.
status_url = http://status:9000
monitor_id = 01M7B5GST1JAZEAJV3ND3J2VET
