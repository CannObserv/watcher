# Keep postgres's working set out of reclaim (watcher#309). Installed to
# /etc/systemd/system/postgresql@.service.d/ — the TEMPLATE, so every cluster
# instance takes it: a major upgrade runs as postgresql@<new>-main, and a drop-in
# pinned to @16-main would leave the new cluster unreserved.
#
# shared_buffers (128M) plus a working margin for page cache. If shared_buffers
# is ever raised, this and system-postgresql.slice must follow it — and while two
# clusters run side by side (pg_upgradecluster), the slice must cover both.
#
# OOMScoreAdjust deliberately untouched: Debian's packaged unit gives the
# postmaster -900 and lets backends reset to 0, so a killed backend costs a
# crash recovery rather than the database.
[Service]
MemoryLow=384M
