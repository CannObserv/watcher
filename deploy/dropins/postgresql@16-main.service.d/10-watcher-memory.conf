# Keep postgres's working set out of reclaim (watcher#309). Installed to
# /etc/systemd/system/postgresql@16-main.service.d/.
#
# shared_buffers (128M) plus a working margin for page cache. If shared_buffers
# is ever raised, this and system-postgresql.slice must follow it.
#
# OOMScoreAdjust deliberately untouched: Debian's packaged unit gives the
# postmaster -900 and lets backends reset to 0, so a killed backend costs a
# crash recovery rather than the database.
[Service]
MemoryLow=384M
