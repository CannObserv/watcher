# Memory reservation for every service on co-watcher (watcher#309).
# Installed to /etc/systemd/system/system.slice.d/ — docs/DEPLOYMENT.md ->
# Host memory posture.
#
# A unit keeps no more memory.low than every slice above it grants, and this
# host's cgroup2 has no memory_recursiveprot. At 0 here, every MemoryLow= below
# is written, reported by `systemctl show`, and protects nothing. The competitor
# is init.scope — the agent sessions — a root-level sibling of this slice.
#
# Must cover the sum of its children's: watcher 512M + postgres slice 384M +
# tailscaled 128M. tests/deploy/test_memory_dropins.py checks the arithmetic.
[Slice]
MemoryLow=1G
