# Protect the tunnel every peer hop runs over (watcher#309). Installed to
# /etc/systemd/system/tailscaled.service.d/.
#
# The broker and status (co-status, the backup's check-in) are MagicDNS names
# on the tailnet, so losing tailscaled takes out both without touching
# watcher; a failing tailscaled was a named symptom of CannObserv/broker's
# 2026-09-16 outage.
#
# 92M measured 2026-09-23 (60M on 09-19), so 128M.
[Service]
MemoryLow=128M
# Below the default 0, where the system daemons and postgres's backends sit, but
# behind watcher's -500: a lost tunnel is a transient bus outage the service
# rides out (docs/BUS-CONNECTION-POLICY.md), so the service should outlive the
# tunnel. Applies at exec — restart tailscaled.
OOMScoreAdjust=-400
