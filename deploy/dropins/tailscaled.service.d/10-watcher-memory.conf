# Protect the tunnel every peer hop runs over (watcher#309). Installed to
# /etc/systemd/system/tailscaled.service.d/.
#
# The broker and notifier are MagicDNS names on the tailnet, so losing
# tailscaled takes out both without touching watcher; a failing tailscaled was
# a named symptom of CannObserv/broker's 2026-09-16 outage.
#
# 92M measured 2026-09-23 (60M on 09-19), so 128M.
[Service]
MemoryLow=128M
# Below the default 0, where every npm/node process sits, but behind watcher's
# -500: the dashboard is reached through the exe.dev proxy, not the tailnet, so
# it should outlive the tunnel. Applies at exec — restart tailscaled.
OOMScoreAdjust=-400
