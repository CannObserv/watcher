# #331: needrestart lists restarts, never performs them.
#
# apt's hook runs `needrestart -m u` after every dpkg run, and Ubuntu's patch
# makes that AUTOMATIC restarts when this key is unset - the stock state. A
# libc6 security update would then restart watcher and PostgreSQL mid-apply:
# the one process running the API, the Procrastinate worker and both bus
# consumers, outside a window. With the key set, needrestart prints
# "Disabling Ubuntu mode, explicit restart mode configured" and only lists.
# Shape from CannObserv/notifier#91 and CannObserv/broker#65.
#
# Keep `$nrconf{ui}` unset: setting it without this key forces interactive
# mode. A parse error here makes needrestart die, which the hook swallows with
# `|| true` - restarting nothing, so it fails safe.
$nrconf{restart} = 'l';
