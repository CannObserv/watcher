[project]
name = "watcher"
version = "0.1.0"
description = "General-purpose web monitoring service: fingerprints the content at registered URLs on a schedule and reports each change."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0,<1",
    # Imported directly — every schema is pydantic v2. Until #294 its bounds were
    # co-core's (>=2.12,<3; FastAPI's range has no cap): a major is ours to adopt.
    "pydantic>=2.12,<3",
    "python-json-logger>=4.0.0,<5",
    "uvicorn>=0.34.0,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.32.0,<1",
    "alembic>=1.15.0,<2",
    "python-ulid>=3.0.0,<4",
    # No `[psycopg]` extra — procrastinate never published one; psycopg[pool] is
    # a base requirement, and PsycopgConnector uses it internally (#242).
    "procrastinate>=3.0,<4",
    "httpx>=0.28.0,<1",
    "jinja2>=3.1.6,<4",
    "python-multipart>=0.0.33,<1",
    # No [extract]: the processor extracts (#350); watcher needs the models, the
    # bus contract and the stdlib-only media-type rule. Exact, because watcher
    # resolves the essence Processor dispatches on and Processor never re-resolves
    # it: bumped when CannObserv/processor coordinates a contract change, not on a
    # schedule (#366). Both resolve from the co-pypi index alone ([tool.uv.sources],
    # #358), and uv.lock holds each file's sha256.
    "co-core==0.37.0",
    "co-core-aio[bus]==0.37.0",
    # Imported directly by the bus layer; docs/BUS-CONNECTION-POLICY.md was
    # measured on redis-py 7.4.1, so a major is ours to adopt, not co-core-aio's (#294).
    "redis>=7.4,<8",
    "google-cloud-storage>=3.17.1,<4",
    # src/ops/backup.py and restore.py import its exceptions; arrives via google-cloud-storage (#294).
    "google-api-core>=2.44.0,<3",
]

[dependency-groups]
dev = [
    "anyio>=4.16.0,<5",
    # tests/dashboard parses HTMX responses; production parses no HTML itself —
    # the processor owns the extraction stack (#350).
    "beautifulsoup4>=4.15.0,<5",
    # In-memory Redis for the bus producer and consumer tests (#245); mirrors
    # replicator's test harness so both ends of a stream test alike.
    "fakeredis>=2.40.0,<3",
    # Imported directly by tests/test_dependency_extras.py; declared rather than
    # relied on as a transitive of procrastinate (#242).
    "packaging>=24,<27",
    "pre-commit>=4.7.0,<5",
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.4.1.post1,<2",
    "pytest-cov>=7.1.0,<8",
    # Imported directly by tests/dashboard/test_css_sources.py to read the
    # pre-commit and CI configs (#352); declared, not relied on via pre-commit.
    "pyyaml>=6,<7",
    "ruff>=0.17.4,<0.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not integration and not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    # #353: run with nothing but TEST_DATABASE_URL and no outbound network,
    # every integration test passed. CI runs them in the `integration` job;
    # conftest's network_guard keeps "nothing external" true for every non-live test.
    "integration: connects to the test database (TEST_DATABASE_URL) and nothing external; excluded by default, run with -m integration (CI: integration job)",
    "live: needs a real external service or credential; excluded by default and from every gate, run by hand with -m live",
]
filterwarnings = [
    "error::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# extend-, not exclude: the bare key replaces ruff's defaults (node_modules/,
# venv/, .tox/, ...), which .gitignore does not cover.
# ruff 0.16 formats Markdown code fences by default (#315); two entries exist for
# it. docs/plans/ is a dated record, and reformatting its samples rewrites what
# was proposed; skills/ serves vendored content through symlinks, and its file
# symlinks dangle in CI, whose checkout skips the skills-vendor/ submodules.
extend-exclude = ["skills-vendor/", "skills/", "docs/plans/", "alembic/versions/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# certifi is transitive (httpx, requests) and nothing imports it, so its floor is
# a constraint, not a dependency: 2026.10.19 drops emSign ECC Root CA - G3, the
# root the leaked eMudhra intermediates chain to (#391, GHSA-6q48-6c7w-9gw2).
# Gate: tests/test_dependency_certifi_floor.py.
constraint-dependencies = ["certifi>=2026.10.19"]

# The cannobserv packages' index (#358; cannobserv RELEASING.md → Path C). The URL
# is the org registry's byte for byte, trailing slash included, so Dependabot
# matches it. Explicit: it serves only the names [tool.uv.sources] pins to it,
# so co-core never comes from PyPI and nothing else comes from here. Auth is a
# per-command token: `bash scripts/co-pypi.sh uv lock` (docs/DEPENDENCIES.md).
# Guard: tests/test_dependency_index.py.
[[tool.uv.index]]
name = "co-pypi"
url = "https://us-west1-python.pkg.dev/co-gcs/co-pypi/simple/"
explicit = true

[tool.uv.sources]
# Every cannobserv package is declared directly and pinned here: uv binds a
# source to a direct dependency only, so a transitive one would go to PyPI.
co-core = { index = "co-pypi" }
co-core-aio = { index = "co-pypi" }
