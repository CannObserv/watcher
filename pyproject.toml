[project]
name = "watcher"
version = "0.1.0"
description = "Web service for monitoring cannabis industry activity: licenses, regulatory filings, compliance events, and entity relationships."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1",
    "python-json-logger>=4.0.0,<5",
    "uvicorn>=0.34.0,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30.0,<1",
    "alembic>=1.15.0,<2",
    "python-ulid>=3.0.0,<4",
    "beautifulsoup4>=4.12.0,<5",
    "lxml>=5.0,<7",
    "pypdf>=5.0,<7",
    "openpyxl>=3.1.0,<4",
    # No `[psycopg]` extra — procrastinate never published one; psycopg[pool] is
    # a base requirement, and PsycopgConnector uses it internally (#242).
    "procrastinate>=3.0,<4",
    "jsonschema>=4.21.0,<5",
    "httpx>=0.28.0,<1",
    "aiosmtplib>=5.1.0,<6",
    "email-validator>=2.0,<3",
    "jinja2>=3.1.6,<4",
    "python-multipart>=0.0.22,<1",
    "html5lib>=1.1",
    "notifier-client",
    "archiver-client>=4.0.0,<5",
    "co-core[extract]>=0.8.0,<0.9",
    "co-core-aio[bus]>=0.8.0,<0.9",
]

[dependency-groups]
dev = [
    "anyio>=4.12.1,<5",
    # In-memory Redis for the fetch-policy producer tests (#245); mirrors
    # replicator's test harness so the two ends of the stream test alike.
    "fakeredis>=2.26,<3",
    "openapi-python-client>=0.21,<1",
    # Imported directly by tests/test_dependency_extras.py; declared rather than
    # relied on as a transitive of procrastinate (#242).
    "packaging>=24,<27",
    "pre-commit>=4.5.1,<5",
    "pytest>=8.0,<9",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=6.0,<7",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not integration'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: marks tests that hit live external services; excluded by default (run with -m integration)",
]
filterwarnings = [
    "error::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["skills-vendor/", "alembic/versions/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# cannobserv workspace packages (co-core, co-core-aio) resolve from the local
# wheelhouse mirrored from the private GCS index gs://co-gcs-pypi (#220).
# Populate it before any `uv` command: scripts/sync_wheelhouse.py. Reproducibility
# is anchored by uv.lock (it pins the exact resolved version to a named wheelhouse
# artifact; find-links locks by filename, not hash), not by wheelhouse contents.
find-links = ["./.wheelhouse"]

[tool.uv.sources]
notifier-client = { git = "ssh://git@github-notifier/CannObserv/notifier.git", subdirectory = "clients/python", rev = "v0.2.1" }
archiver-client = { path = "../archiver/clients/python", editable = true }
