{% extends "base.html" %}
{% block title %}New Watch — watcher{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-6">New Watch</h2>

{% include "partials/flash.html" %}

<form method="post" class="max-w-xl space-y-6">
  <div>
    <label for="name" class="form-label">Name</label>
    <input type="text" name="name" id="name" required
      value=""
      class="form-input mt-1">
    <p id="name-error" class="mt-1 text-xs text-red-600 dark:text-red-400" hidden></p>
  </div>

  <div>
    <label for="url" class="form-label">URL</label>
    <input type="url" name="url" id="url" required
      value=""
      class="form-input mt-1">
    <p id="url-error" class="mt-1 text-xs text-red-600 dark:text-red-400" hidden></p>
  </div>

  <div>
    <label for="content_type" class="form-label">Content Type</label>
    <select name="content_type" id="content_type"
      class="form-input mt-1">
      {% for ct in content_types %}
      <option value="{{ ct.value }}">{{ ct.value | upper }}</option>
      {% endfor %}
    </select>
    <p id="content_type-error" class="mt-1 text-xs text-red-600 dark:text-red-400" hidden></p>
  </div>

  <div>
    <label for="interval" class="form-label">Check Interval</label>
    <input type="text" name="interval" id="interval" placeholder="1d"
      value=""
      aria-describedby="interval-hint"
      class="form-input mt-1">
    <p id="interval-hint" class="mt-1 text-xs text-gray-500 dark:text-gray-400">Format: 30s, 15m, 6h, 1d</p>
    <p id="interval-error" class="mt-1 text-xs text-red-600 dark:text-red-400" hidden></p>
  </div>

  <div class="flex gap-3">
    <button type="submit" class="btn btn-primary">Create Watch</button>
    <a href="/watches" class="btn btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
