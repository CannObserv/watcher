{# Raw URL fallback input — swapped in when user selects Manual mode. #}
{# Provides a plain Apprise URL text field with links to Apprise docs. #}
<div id="plugin-token-form">
  <label for="apprise_url" class="form-label">Apprise URL</label>
  <input
    type="text"
    id="apprise_url"
    name="apprise_url"
    class="form-input mt-1"
    placeholder="slack://T.../A.../T.../#channel"
    required
    aria-required="true">
  <p class="text-xs text-gray-500 dark:text-gray-400 mt-2">
    <a href="https://appriseit.com/getting-started/universal-syntax/" target="_blank" rel="noopener noreferrer" class="link">URL syntax guide</a>
    <span aria-hidden="true"> · </span>
    <a href="https://appriseit.com/tools/url-builder/" target="_blank" rel="noopener noreferrer" class="link">Apprise URL Builder</a>
  </p>
</div>
