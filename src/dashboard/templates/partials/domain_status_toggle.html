{# Domain status toggle partial. Expects: domain.
   Two visual states: Active (green), Inactive (gray).
   Toggle disabled when archived; archive state shown. #}
<div class="p-4" id="domain-status-toggle">
  <div class="grid grid-cols-[1fr_auto] sm:grid-cols-[min(18rem,40%)_1fr] items-center gap-x-4 gap-y-1">
    <div class="min-w-0">
      <span class="form-label mb-0">Status</span>
    </div>
    <div class="flex items-center gap-3">
      <label class="toggle">
        <input type="checkbox" name="active" value="true"
          {% if domain.is_active %}checked{% endif %}
          {% if domain.archived_at is not none %}disabled{% endif %}
          hx-post="/domains/{{ domain.name }}/toggle-active"
          hx-target="#domain-status-toggle"
          hx-swap="outerHTML"
          hx-include="#wi-search,[name='status'],[name='sort'],[name='order']">
        <span class="toggle__track"><span class="toggle__thumb"></span></span>
        <span class="toggle__label">
          {% if domain.archived_at is not none %}
          <span class="badge badge-archived">Archived</span>
          {% elif domain.is_active %}
          <span class="badge badge-active">Active</span>
          {% else %}
          <span class="badge badge-inactive">Inactive</span>
          {% endif %}
        </span>
      </label>
      {% if domain.archived_at is not none %}
      <form method="post" action="/domains/{{ domain.name }}/restore">
        <button type="submit"
          hx-post="/domains/{{ domain.name }}/restore"
          hx-target="body"
          class="btn btn-secondary py-1 px-3 text-sm">Restore from archive</button>
      </form>
      {% endif %}
      <noscript>
        <form method="post" action="/domains/{{ domain.name }}/toggle-active" class="inline">
          <input type="hidden" name="active" value="{{ 'false' if domain.is_active else 'true' }}">
          <button type="submit" class="btn btn-secondary py-1 px-3 text-sm">
            {{ "Deactivate" if domain.is_active else "Activate" }}
          </button>
        </form>
      </noscript>
    </div>
  </div>
</div>
