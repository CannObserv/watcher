{# InfoItem picker — renders a <select> populated from
   ``info_items`` in template context. The route handler is responsible
   for resolving the SDK call (``client.list_info_items()``) and passing
   the list. #}
<label for="info_item_id" class="form-label">Information Item</label>
<select name="info_item_id" id="info_item_id" required class="form-input mt-1">
  <option value="" disabled {% if not selected_info_item_id %}selected{% endif %}>Choose an Information Item…</option>
  {% for item in info_items %}
  <option value="{{ item.info_item_id }}"
          {% if selected_info_item_id == item.info_item_id %}selected{% endif %}>
    {{ item.name }}
  </option>
  {% endfor %}
</select>
{% if not info_items %}
<p class="mt-1 text-xs text-orange-600 dark:text-orange-400">
  No Information Items yet — create one in the Information service first.
</p>
{% endif %}
<p id="info_item_id-error" class="mt-1 text-xs text-red-600 dark:text-red-400" hidden></p>
