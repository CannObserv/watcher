{# InfoSource picker — plain text input for an InfoSource ULID.
   Operator pastes the 26-char ULID from the Archiver UI. #}
<label for="info_source_id" class="form-label">InfoSource ID</label>
<input type="text" name="info_source_id" id="info_source_id" required
  placeholder="01XXXXXXXXXXXXXXXXXXXXXXXXX"
  pattern="[0-9A-Za-z]{26}"
  title="26-character ULID from the Archiver service"
  class="form-input mt-1 font-mono">
<p id="info_source_id-hint" class="mt-1 text-xs text-gray-500 dark:text-gray-400">
  Paste the InfoSource ULID from the Archiver service.
</p>
<p id="info_source_id-error" class="mt-1 text-xs text-red-600 dark:text-red-400" hidden></p>
